name: Publish container image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve v86-runner submodule commit
        id: v86_runner
        run: echo "sha=$(git rev-parse HEAD:submodules/v86-runner)" >> "$GITHUB_OUTPUT"

      - name: Checkout v86-runner
        uses: actions/checkout@v4
        with:
          repository: kevin-cazal/v86-runner
          path: submodules/v86-runner
          ref: ${{ steps.v86_runner.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_OFFICIAL_BUNDLE_URL=https://cdn.cazal.eu/shell-1-256M.v86b
            VITE_MIRROR_BUNDLE_URLS=https://github.com/kevin-cazal/vm-image-discover-linux-1/releases/latest/download/shell-1-256M.v86b,https://gitlab.com/api/v4/projects/83317930/packages/generic/vm-artifacts/latest/shell-1-256M.v86b,https://lab.epitech.academy/dl/shell-1-256M.v86b
            VITE_VM_MEMORY_MB=256
          cache-from: type=gha
          cache-to: type=gha,mode=max
